schema: sonic.runtime_profile
version: 1
profile: agent_full_current
endpoints:
  policy_server: {host: 127.0.0.1, port: 29999}
  camera_server: {host: 192.168.123.164, port: 5555}
  cpp_command: {host: 127.0.0.1, port: 5556}
  cpp_state: {host: 127.0.0.1, port: 5557}
  navigation_command: {host: 127.0.0.1, port: 5558}
  navigation_status: {host: 127.0.0.1, port: 5559}
  sensor_gateway_metadata: {host: 127.0.0.1, port: 5560}
  control_gateway_intent: {host: 127.0.0.1, port: 5561}
  planner_relay: {host: 127.0.0.1, port: 5563}
  depth_anything: {host: 127.0.0.1, port: 5564}
  control_gateway_dispatch: {host: 127.0.0.1, port: 5565}
  sensor_gateway_visualization_ingress: {host: 127.0.0.1, port: 5566}
  runtime_metrics_ingress: {host: 127.0.0.1, port: 5567}
  navdp_velocity: {host: 127.0.0.1, port: 5568}
  orientation_telemetry: {host: 127.0.0.1, port: 5569}
  navigation_runtime_status: {host: 127.0.0.1, port: 5570}
  runtime_event_ingress: {host: 127.0.0.1, port: 5571}
  xnavdp_http: {host: 127.0.0.1, port: 19999}
ros_topics:
  lidar: /livox/lidar
  lidar_imu: /livox/imu
  odometry: /Odometry_loc
  registered_cloud: /cloud_registered_1
components:
  launcher:
    sim: false
    opencv_viewer: true
    keyboard_planner: true
    planner_input: lavira
    depth_anything_ready_timeout_s: 180.0
    base_pose_enabled: true
    slam_debug: false
    data_exporter: false
    lidar_ready_timeout_s: 30.0
    navigation_ready_timeout_s: 60.0
  deploy:
    input_type: zmq_manager
    policy_variant: sonic_v1_1  # default | low_latency | sonic_v1_1
    checkpoint: ''
    obs_config: ''
    planner: ''
    motion_data: ''
    output_type: ''
  vla:
    embodiment_tag: unitree_g1_sonic
    #prompt: &vla_task_prompt >-
    #  Approach the tabletop if necessary, then use the right hand to pick up the
    #  paper ball and place it into the blue plastic basket, use the left hand to
    #  place another paper ball into the same basket, and finally return both arms
    #  to the sides of the body.
    prompt: &vla_task_prompt >-
      Move in front of the table, grasp the medicine bottle, and place it into the blue basket.
    inference_hz: 2.0
    action_publish_rate: 50
    action_horizon: 50
    sensor_gateway_poll_hz: 50.0
    sensor_gateway_request_timeout_ms: 100
    sensor_gateway_max_age_ms: 1000.0
    sensor_gateway_max_skew_ms: 5.0
  lavira:
    task_type: object_nav
    mission: find the blue basket
    global_target: blue basket
    question: ''
    max_steps: 20
    history_size: 5
    la_model: Qwen3.5-27B-Q4_K_M
    la_base_url: http://127.0.0.1:8000/v1
    la_timeout_seconds: 180.0
    va_model: Qwen3.5-27B-Q4_K_M
    va_base_url: http://127.0.0.1:8001/v1
    va_timeout_seconds: 180.0
    camera_timeout_ms: 15000
    sensor_gateway_request_timeout_ms: 100
    sensor_gateway_max_age_ms: 1000.0
    sensor_gateway_max_skew_ms: 5.0
    min_confidence: 0.6
    segment_timeout_seconds: 180.0
  base_pose:
    task: >-
      align to the blue basket
    target_prompt: bluebasket
    surface_prompt: desk
    planner_hz: 20.0
    final_stop_count: 3
    sensor_gateway_request_timeout_ms: 100
    sensor_gateway_max_age_ms: 1000.0
    sensor_gateway_max_skew_ms: 5.0
    camera_timeout_ms: 15000
    camera_intrinsics_path: gear_sonic/config/camera_intrinsics.json
    camera_pitch_deg: -38.0
    camera_roll_deg: 0.0
    camera_yaw_deg: 0.0
    camera_forward_offset_m: 0.0
    camera_lateral_offset_m: 0.0
    dual_head_camera_stream: ego_view
    dual_head_depth_stream: camera/ego_view_depth
    dual_chest_camera_stream: chest_view
    dual_chest_depth_stream: camera/chest_view_depth
    dual_chest_camera_pitch_deg: -3.0
    dual_chest_camera_roll_deg: 0.0
    dual_chest_camera_yaw_deg: 0.0
    dual_chest_camera_forward_offset_m: 0.0
    dual_chest_camera_lateral_offset_m: 0.0
    dual_match_tolerance_frames: 30
    dual_head_reacquire_frames: 1
    dual_head_release_missing_frames: 3
    dual_rgbd_buffer_size: 8
    dual_rgbd_poll_hz: 60.0
    output_root: outputs/base_pose_adjustment
    raw_yoloe_model_path: tools/yoloe26m/weights/yoloe-26m-seg.pt
    raw_yoloe_device: '0'
    raw_yoloe_confidence: 0.25
    raw_yoloe_imgsz: 640
    raw_head_target_distance_m: 0.9
    raw_chest_target_distance_m: 0.7
    raw_forward_tolerance_m: 0.10
    raw_lateral_tolerance_m: 0.10
    raw_min_linear_speed_m_s: 0.35
    raw_max_lateral_speed_m_s: 0.40
    raw_min_yaw_speed_rad_s: 0.10
    raw_yaw_tolerance_deg: 3
    raw_yaw_coarse_speed_rad_s: 0.30
    raw_yaw_trim_speed_rad_s: 0.10
    raw_forward_recenter_yaw_speed_rad_s: 0.30
    raw_horizontal_guard_fraction: 0.25
    raw_horizontal_recovery_fraction: 0.30
    raw_camera_stale_s: 0.40
    raw_max_run_s: 180.0
    raw_post_stop_sample_frames: 30
    raw_post_stop_deviation_frames: 10
  navdp:
    root: /home/user/Project/NavDP/baselines/x-navdp
    checkpoint: /home/user/Project/NavDP/baselines/x-navdp/checkpoints/x-navdp_posttrain.ckpt
    control_hz: 20.0
    mpc_hz: 10.0
    mpc_result_timeout_s: 0.3
    heading_preview_s: 0.6
    goal_tolerance_m: 0.5
    stop_threshold: -4.0
    request_timeout_s: 10.0
    sensor_gateway_poll_hz: 20.0
    sensor_gateway_request_timeout_ms: 100
    sensor_gateway_max_age_ms: 1000.0
    sensor_gateway_max_skew_ms: 5.0
    odometry_timeout_s: 0.3
    trajectory_timeout_s: 2.5
    heading_angular_speed_rad_s: 0.4
    heading_tolerance_deg: 3.0
    heading_stable_frames: 3
    heading_timeout_s: 12.0
  fastlio:
    workspace: /home/user/Project/fastlio_humanoid_ws
    livox_sdk_lib: /home/user/Project/livox_sdk2_install/lib
    config: mid360.yaml
  planner_executor:
    control_hz: 20.0
    manual_velocity_timeout_s: 0.70
    navdp_velocity_timeout_s: 0.30
    radar_timeout_s: 0.75
    sensor_gateway_poll_hz: 20.0
    sensor_gateway_request_timeout_ms: 100
    sensor_gateway_max_age_ms: 1000.0
  xnavdp_mpc:
    horizon_steps: 30
    desired_velocity: 0.3
    max_linear_velocity: 0.3
    max_angular_velocity: 0.8
    reference_gap: 3
    dt: 0.1
    reference_trajectory_length_m: 2.0
    minimum_desired_velocity: 0.0
    interpolation_ratio: 50
    lookahead_points: 10
    linear_control_weight: 5.0
    angular_control_weight: 0.02
    curvature_speed_gain: 0.15
  depth_anything:
    root: /home/user/Project/Depth-Anything-V2/metric_depth
    checkpoint: /home/user/Project/Depth-Anything-V2/metric_depth/checkpoints/depth_anything_v2_metric_hypersim_vitb.pth
    camera_intrinsics_path: gear_sonic/config/camera_intrinsics.json
    encoder: vitb
    device: cuda
    inference_hz: 10.5
    idle_heartbeat_hz: 2.0
    sensor_gateway_request_timeout_ms: 100
    sensor_gateway_max_age_ms: 1000.0
    input_size: 644
    model_max_depth_m: 20.0
    publish_max_depth_m: 20.0
    use_amp: true
  data_exporter:
    frequency_hz: 50
    sensor_gateway_poll_hz: 50.0
    sensor_gateway_request_timeout_ms: 100
    sensor_gateway_max_age_ms: 1000.0
    sensor_gateway_max_skew_ms: 5.0
    record_chest_camera: false
    task_prompt: ''
    dataset_name: ''
  sensor_gateway:
    snapshot_history_size: 64
    shared_memory_slots: 8
    frame_ttl_ms: 1000
    retired_ring_ttl_s: 2.0
    timestamp_basis: receive
    loop_hz: 200.0
    camera_expected_hz: 30.0
    cpp_state_expected_hz: 50.0
    lidar_expected_hz: 10.0
    imu_expected_hz: 200.0
    odometry_expected_hz: 10.0
    registered_cloud_expected_hz: 10.0
    visualization_expected_hz: 20.0
    runtime_metrics_window_size: 100
  control_gateway:
    command_ttl_ms: 1000
  slam_recovery:
    # Normal NavDP motion is capped at 0.3 m/s and 0.8 rad/s. These limits only
    # catch estimator motion that is clearly outside the commanded envelope.
    startup_grace_s: 5.0
    max_planar_speed_m_s: 1.5
    max_position_step_m: 1.0
    max_yaw_rate_rad_s: 2.5
    consecutive_samples: 3
