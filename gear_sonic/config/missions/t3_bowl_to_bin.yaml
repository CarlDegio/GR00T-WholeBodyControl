# T3: latest recorded Full VLN configuration, migrated to the flexible LA loop.
# One skill covers the whole manipulation; LA may navigate/reason again at any time.
# Start the matching PolicyServer on port 29999. Preserve its trained prompt verbatim.
# Source runtime and task identity are metadata; shared services use the base profile.
# The recorded T3 policy prompt really is "collect the pill bottle"; do not rename it.
components:
  mission_metadata:
    task_id: T3
    source_runtime: outputs/experiments/full_vln_T3_invisible_02_55dba30d4677/runtime.yaml
  deploy:
    demo_controls: true
  base_pose:
    dual_match_tolerance_frames: 30
    raw_head_target_distance_m: 1.1
    raw_head_approach_cutoff_m: 1.5
    raw_chest_target_distance_m: 0.9
    raw_chest_approach_cutoff_m: 1.1
    raw_forward_tolerance_m: 0.1
    raw_lateral_tolerance_m: 0.08
    raw_min_linear_speed_m_s: 0.4
    raw_max_lateral_speed_m_s: 0.4
    raw_min_yaw_speed_rad_s: 0.1
    raw_yaw_tolerance_deg: 3
    raw_yaw_coarse_speed_rad_s: 0.3
    raw_yaw_trim_speed_rad_s: 0.1
    raw_forward_recenter_yaw_speed_rad_s: 0.3
  lavira:
    flexible_mission: true
    operation_alignment_max_age_seconds: 30.0
    mission: move to the white rubbish bin , turn left, move to the fire extinguisher,move to the refrigerator
      ,turn right and move to the bowl on the desk, then move forward to approach the bowl on the desk,pick
      up the bowl, step on the trash bin pedal to hold the lid open,empty the bowl into the bin and put it
      back to the desk.
    navigation_mode: vln
    global_target: ''
    manipulation_prompt: ''
    skills:
      bowl_to_bin:
        backend: bowl_to_bin_vla
        geometry_target: bowl
        vla_prompt: move forward to approach the bowl on the desk,pick up the bowl, step on the trash bin pedal
          to hold the lid open,empty the bowl into the bin and put it back to the desk.
        vla_trained_prompt: collect the pill bottle
        completion:
          kind: visual
        timeout_seconds: 180.0
        on_timeout: fail
        completion_settle_seconds: 0.0
        exit: default
  vla:
    default_skill: bowl_to_bin_vla
    prewarm_backends: true
    backends:
      bowl_to_bin_vla:
        host: 127.0.0.1
        port: 29999
        prompt: collect the pill bottle
