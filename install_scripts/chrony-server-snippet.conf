# Append to /etc/chrony/chrony.conf — configure this PC as LAN NTP server
# Subnet matches wlp4s0: 192.168.1.41/24

# Allow local network clients to sync
allow 192.168.1.0/24

# Local stratum (serve time even when upstream is down)
local stratum 10

# Optional: keep syncing from internet for accuracy
pool time.nist.gov iburst
